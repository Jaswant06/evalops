app: docqa
version: "1.2.0"
description: >-
  Fix for 1.1: keeps the friendlier, more complete style but forbids anything the document does not say and requires a citation for every fact.
adapter: docqa.adapter:DocQAAdapter
settings:
  model: {name: "qwen3.5:4b", digest: 3c3adf637187}
  prompt: prompts/docqa/answer_v3.txt
  options: {temperature: 0, seed: 7, num_ctx: 8192, num_predict: 512}
  retrieval: {method: bm25, top_k: 4}
