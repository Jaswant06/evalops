# Required checks for every pull request: fast enough to run on each change.
# Extended reliability scenarios run on a schedule in reliability.yml.
# Make "tests (3.11)", "tests (3.13)" and "release-gate" required (see .github/rulesets/main.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: evalops
          POSTGRES_DB: evalops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalops" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit, integration and basic failure-handling tests
        run: pytest -q          # extended reliability scenarios are excluded here (pytest -m reliability)
        env:
          EVALOPS_TEST_DATABASE_URL: postgresql+psycopg://evalops:evalops@localhost:5432/evalops

  # Validates configs and datasets, replays the recorded outputs, rescores them with this
  # pull request's code, gates production against the base branch and checks the evidence.
  # It fails (nonzero exit) on a blocked decision, an invalid or incomplete evaluation, a stale
  # release.yaml or an app version that was never evaluated.
  release-gate:
    runs-on: ubuntu-latest
    needs: tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: evalops
          POSTGRES_DB: evalops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalops" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      EVALOPS_DATABASE_URL: postgresql+psycopg://evalops:evalops@localhost:5432/evalops
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the gate compares against production on the base branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[postgres]"
      - name: Validate configs and verify dataset hashes
        run: evalops validate
      - name: Replay recorded outputs, rescore, and apply the release gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          evalops ci --base-ref "$BASE"
      - name: Upload evaluation and gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evalops-reports
          path: .evalops/runs
          if-no-files-found: ignore
