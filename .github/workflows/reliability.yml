# Extended reliability testing, kept out of the pull-request path so ordinary changes stay fast:
# weekly, on demand, and when the engine, release logic or drills change on main.
name: reliability

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/evalops/engine.py"
      - "src/evalops/release.py"
      - "src/evalops/store.py"
      - "scripts/failure_drills.py"
      - "tests/reliability/**"

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  # Break things on purpose on the recorded DocQA outputs and check the response:
  # wrong answers, unsupported citations, timeouts, malformed output, a slower model,
  # an edited dataset, an interrupted run, a database outage, changed model weights,
  # and a valid candidate as the control.
  failure-drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[postgres]"
      - run: python scripts/failure_drills.py --summary "$GITHUB_STEP_SUMMARY" --json drills.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-drills
          path: drills.json

  # Real processes and a real database: concurrent promotions, SIGINT and resume, extended
  # timeouts and retries, eight concurrent evaluations, and stopping PostgreSQL mid-run.
  reliability-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: evalops
          POSTGRES_DB: evalops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalops" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Extended reliability scenarios
        run: pytest -m reliability -v
        env:
          EVALOPS_TEST_DATABASE_URL: postgresql+psycopg://evalops:evalops@localhost:5432/evalops
          EVALOPS_RELIABILITY_PG_CONTAINER: ${{ job.services.postgres.id }}
